<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作日誌看板</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2129;--sub:#5c6370;--line:#e3e6eb;--brand:#f35023;--ok:#00a58c;--ok-bg:#dff6f1;--warn:#b7791f;--warn-bg:#fdf3dc;--bad:#d9363e;--bad-bg:#fde8ea;--info:#2f6fed;--info-bg:#e5eeff;--code:#eef0f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1a1f29;--text:#e6e8ec;--sub:#9aa1ad;--line:#2b323f;--ok:#2fd0b5;--ok-bg:#12332d;--warn:#f0c15b;--warn-bg:#3a2f14;--bad:#ff7a82;--bad-bg:#3d1c20;--info:#7da7ff;--info-bg:#1b2a47;--code:#242b37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,"PingFang TC","PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px}
.wrap{max-width:1080px;margin:0 auto}
h1{margin:0;font-size:20px}
.meta{color:var(--sub);font-size:12.5px}
nav{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 14px;border-radius:16px;cursor:pointer;font-size:14px}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.num{font-size:28px;font-weight:700;line-height:1.1}
.lbl{color:var(--sub);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--code);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;padding:0 8px;border-radius:10px;font-size:12px;line-height:20px;white-space:nowrap}
.s-todo{background:var(--code);color:var(--sub)}.s-doing{background:var(--info-bg);color:var(--info)}
.s-review{background:var(--warn-bg);color:var(--warn)}.s-done{background:var(--ok-bg);color:var(--ok)}
.s-blocked{background:var(--bad-bg);color:var(--bad)}.s-absent{background:var(--bad-bg);color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col h3{margin:0 0 8px;font-size:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--brand)}
.item .t{font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 10px;border-radius:8px;font-size:14px}
.day{margin:18px 0 6px;font-weight:700;color:var(--sub)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.doc h1,.doc h2,.doc h3{margin:14px 0 6px}
.doc h1{font-size:18px}.doc h2{font-size:16px}.doc h3{font-size:14.5px}
.doc code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:12.5px}
.doc pre{background:var(--code);padding:10px;border-radius:8px;overflow:auto}
.doc ul{padding-left:20px;margin:6px 0}
.doc li.cb{list-style:none;margin-left:-20px}
.empty{color:var(--sub);padding:24px;text-align:center}
.back{cursor:pointer;color:var(--brand);margin-bottom:10px;display:inline-block}
@media (max-width:600px){h1{font-size:18px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>工作日誌看板</h1>
  <div class="meta" id="gen"></div>
  <nav id="nav">
    <button data-v="overview" class="on">概覽</button>
    <button data-v="progress">進度</button>
    <button data-v="plans">計畫</button>
    <button data-v="tasks">任務卡</button>
    <button data-v="logs">日誌</button>
  </nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<script>
var DATA = /*__DATA__*/null;
var ST = {todo:'待辦',doing:'進行中',review:'待驗收',done:'已完成',blocked:'阻塞'};
var STO = ['todo','doing','review','done','blocked'];
var state = {view:'overview', openTask:null, openLog:null, agent:'', task:'', q:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return s;
}
function md(src){
  var lines=String(src).replace(/\r/g,'').split('\n'),out=[],list=false,code=false,buf=[];
  function closeList(){if(list){out.push('</ul>');list=false}}
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^```/.test(l)){
      if(code){out.push('<pre>'+esc(buf.join('\n'))+'</pre>');buf=[];code=false}
      else{closeList();code=true}
      continue;
    }
    if(code){buf.push(l);continue}
    var m;
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){closeList();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');continue}
    if((m=l.match(/^\s*- \[([ xX])\]\s+(.*)$/))){
      if(!list){out.push('<ul>');list=true}
      out.push('<li class="cb">'+(m[1]==' '?'☐ ':'☑ ')+inline(m[2])+'</li>');continue;
    }
    if((m=l.match(/^\s*[-*]\s+(.*)$/))){
      if(!list){out.push('<ul>');list=true}
      out.push('<li>'+inline(m[1])+'</li>');continue;
    }
    if(/^\s*$/.test(l)){closeList();continue}
    closeList();out.push('<p>'+inline(l)+'</p>');
  }
  closeList();
  if(code)out.push('<pre>'+esc(buf.join('\n'))+'</pre>');
  return out.join('\n');
}
function pct(a,b){return b?Math.round(a*100/b):0}
function tag(st){return '<span class="tag s-'+st+'">'+(ST[st]||esc(st))+'</span>'}
function nextDay(d){var x=new Date(d+'T00:00:00');x.setDate(x.getDate()+1);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)}
function planFor(d){return DATA.plans.filter(function(p){return p.date===d})[0]}
function planChip(p){
  if(!p)return '<span class="tag s-blocked">沒有計畫檔</span>';
  var low=p.total_hours<DATA.min_hours, over=p.total_hours>7.5;
  return (low?'<span class="tag s-blocked">需求不足</span> ':(over?'<span class="tag s-review">超載（>7.5h）</span> ':'<span class="tag s-done">需求充足</span> '))+
    (p.draft?'<span class="tag s-review">草案</span> ':'<span class="tag s-doing">定稿</span> ');
}
function overview(){
  var t=DATA.tasks,l=DATA.logs;
  var cnt={};STO.forEach(function(s){cnt[s]=0});t.forEach(function(x){cnt[x.status]=(cnt[x.status]||0)+1});
  var ds=DATA.today, tmr=nextDay(ds);
  var todayLogs=l.filter(function(x){return x.date===ds}).length;
  var absent=l.filter(function(x){return x.absent});
  var pg=DATA.progress[ds], tp=planFor(tmr), cp=planFor(ds);
  var h='<div class="grid">'+
   '<div class="card"><div class="num">'+(pg?pg.main_done+' / '+pg.main_total:'—')+'</div><div class="lbl">今日主任務（Lark 勾選）</div>'+
     '<div class="bar"><i style="width:'+(pg?pct(pg.main_done,pg.main_total):0)+'%"></i></div><div class="meta">'+(pg?('子任務 '+pg.sub_done+' / '+pg.sub_total+' ｜ 同步於 '+esc(pg.updated)):'今日尚無同步')+'</div></div>'+
   '<div class="card"><div class="num">'+(tp?tp.total_hours+'h':'—')+'</div><div class="lbl">明日計畫工時（下限 '+DATA.min_hours+'h）</div><div class="meta" style="margin-top:6px">'+planChip(tp)+(tp?'':'')+'</div></div>'+
   '<div class="card"><div class="num">'+todayLogs+'</div><div class="lbl">今日日誌（'+ds+'）</div></div>'+
   '<div class="card"><div class="num" style="color:'+(absent.length?'var(--bad)':'inherit')+'">'+absent.length+'</div><div class="lbl">旷工記錄</div></div>'+
   '</div>';
  if(tp&&tp.total_hours<DATA.min_hours){
    var ak=DATA.asks[tmr];
    h+='<div class="card" style="margin-bottom:16px;border-color:var(--bad)"><b>明日需求不足</b>：已排 '+tp.items.length+' 項、約 '+tp.total_hours+'h，低於下限 '+DATA.min_hours+'h。'+
       (ak?'監工已在 Lark 要過 '+ak.count+' 次需求。':'監工還沒要過需求。')+'<div class="meta">補法：回覆 Lark 的「需求不足」卡片（每行一條，可寫 2h）／在 tasks/ 新增任務卡（寫 est_hours）／讓 agent 寫 plans/'+tmr+'.json</div></div>';
  }
  if(DATA.needs.length){
    h+='<div class="card" style="margin-bottom:16px"><b>你補充的需求</b>（已併入計畫）：'+DATA.needs.map(function(n){return esc(n.title)+'（'+n.est_hours+'h → '+esc(n.target)+'）'}).join('、')+'</div>';
  }
  h+='<div class="card" style="margin-bottom:16px"><div class="row">任務卡：'+STO.map(function(s){return tag(s)+' '+cnt[s]}).join(' &nbsp; ')+'</div></div>';
  if(cp){h+='<h3>今日計畫 '+planChip(cp)+'</h3>'+planTable(cp)}
  if(tp){h+='<h3>明日計畫 '+planChip(tp)+'</h3>'+planTable(tp)}
  h+='<h3>任務卡</h3>';
  if(!t.length)h+='<div class="empty">還沒有任務卡（tasks/）</div>';
  t.forEach(function(x){
    h+='<div class="item" data-task="'+esc(x.file)+'"><div class="row"><span class="t">'+esc(x.id)+' '+esc(x.title)+'</span>'+tag(x.status)+
       (x.progress?'<span class="meta">Lark 進度 '+esc(x.progress)+'</span>':'')+
       (x.due?'<span class="meta">截止 '+esc(x.due)+'</span>':'')+'</div>'+
       '<div class="meta">驗收項 '+x.done+' / '+x.total+(x.owner?' ｜ 負責：'+esc(x.owner):'')+'</div></div>';
  });
  h+='<h3>最近日誌</h3>';
  if(!l.length)h+='<div class="empty">還沒有日誌（worklog/）</div>';
  l.slice(0,5).forEach(function(x){h+=logItem(x)});
  if(absent.length){h+='<h3>旷工記錄</h3>';absent.forEach(function(x){h+=logItem(x)})}
  return h;
}
function planTable(p){
  if(!p.items.length)return '<div class="empty">這份計畫沒有任何項目</div>';
  var h='<div class="card"><table style="width:100%;border-collapse:collapse;font-size:13.5px"><tr><th align="left">時段</th><th align="left">任務</th><th align="left">估時</th><th align="left">子任務</th><th align="left">備註</th></tr>';
  p.items.forEach(function(i){
    var note=[];if(i.carried)note.push('順延'+(i.reason?'：'+esc(i.reason):''));if(i.req)note.push('你補充的需求');
    h+='<tr><td>'+esc(i.slot)+'</td><td>'+(i.ref?'['+esc(i.ref)+'] ':'')+esc(i.title)+'</td><td>'+i.est_hours+'h</td><td>'+i.subs+'</td><td>'+note.join('；')+'</td></tr>';
  });
  h+='</table><div class="meta" style="margin-top:6px">合計 '+p.total_hours+'h ｜ 來源：'+esc(p.generated_by)+(p.deferred.length?' ｜ 未排入：'+esc(p.deferred.join('、')):'')+'</div></div>';
  return h;
}
function progressView(){
  var days=Object.keys(DATA.progress).sort().reverse();
  if(!days.length)return '<div class="empty">還沒有進度同步。執行 scripts/supervisor.py sync 或等排程。</div>';
  var h='';
  days.forEach(function(d){
    var g=DATA.progress[d];
    h+='<h3>'+esc(d)+' '+(g.absent?'<span class="tag s-absent">旷工</span> ':'')+'<span class="tag '+(g.main_done===g.main_total?'s-done':'s-doing')+'">'+g.main_done+' / '+g.main_total+' 主任務</span> <span class="meta">子任務 '+g.sub_done+' / '+g.sub_total+' ｜ 催促 '+g.reminders+' 次 ｜ 同步於 '+esc(g.updated)+'</span></h3>';
    h+='<div class="card"><table style="width:100%;border-collapse:collapse;font-size:13.5px"><tr><th align="left">狀態</th><th align="left">時段</th><th align="left">任務</th><th align="left">子任務</th><th align="left">你寫的原因</th></tr>';
    g.items.forEach(function(i){
      h+='<tr><td>'+(i.completed?'✅':'⬜')+'</td><td>'+esc(i.slot||'')+'</td><td>'+(i.ref?'['+esc(i.ref)+'] ':'')+esc(i.title)+'</td><td>'+i.subs_done+'/'+i.subs_total+'</td><td>'+esc((i.reasons||[]).join('；'))+'</td></tr>';
    });
    h+='</table></div>';
  });
  return h;
}
function plansView(){
  if(!DATA.plans.length)return '<div class="empty">還沒有計畫檔（plans/）</div>';
  var h='<div class="meta" style="margin-bottom:8px">工時下限 '+DATA.min_hours+'h；低於下限的日子會在 Lark 主動要需求。</div>';
  DATA.plans.forEach(function(p){
    h+='<h3>'+esc(p.date)+(p.date===DATA.today?'（今日）':'')+' '+planChip(p)+'</h3>'+planTable(p);
  });
  return h;
}
function logItem(x){
  var title=(x.body.match(/^#\s+(.*)$/m)||[0,x.file])[1];
  return '<div class="item" data-log="'+esc(x.file)+'"><div class="row"><span class="t">'+esc(title)+'</span>'+
    (x.absent?'<span class="tag s-absent">旷工</span>':'')+
    '</div><div class="meta">'+esc(x.date)+' '+esc(x.time)+' ｜ '+esc(x.agent)+' ｜ '+esc(x.task)+'</div></div>';
}
function tasksView(){
  if(state.openTask){
    var x=DATA.tasks.filter(function(t){return t.file===state.openTask})[0];
    if(x)return '<span class="back" id="back">← 返回</span><div class="card" style="margin-bottom:12px"><div class="row"><b>'+esc(x.id)+' '+esc(x.title)+'</b>'+tag(x.status)+'</div>'+
      '<div class="bar"><i style="width:'+pct(x.done,x.total)+'%"></i></div><div class="meta">'+x.done+'/'+x.total+' 項驗收 ｜ 截止 '+esc(x.due||'—')+' ｜ 依賴 '+esc(x.blocked_by||'—')+' ｜ 負責 '+esc(x.owner||'—')+'</div></div><div class="doc">'+md(x.body)+'</div>';
  }
  if(!DATA.tasks.length)return '<div class="empty">還沒有任務卡（tasks/）</div>';
  var h='<div class="cols">';
  STO.forEach(function(s){
    var list=DATA.tasks.filter(function(t){return t.status===s});
    h+='<div class="col"><h3>'+tag(s)+' '+list.length+'</h3>';
    list.forEach(function(x){
      h+='<div class="item" data-task="'+esc(x.file)+'"><div class="t">'+esc(x.id)+' '+esc(x.title)+'</div><div class="bar"><i style="width:'+pct(x.done,x.total)+'%"></i></div><div class="meta">'+x.done+'/'+x.total+(x.due?' ｜ '+esc(x.due):'')+'</div></div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}
function logsView(){
  if(state.openLog){
    var x=DATA.logs.filter(function(l){return l.file===state.openLog})[0];
    if(x)return '<span class="back" id="back">← 返回</span><div class="meta" style="margin-bottom:8px">'+esc(x.file)+'</div><div class="doc">'+md(x.body)+'</div>';
  }
  var agents={},tasks={};DATA.logs.forEach(function(l){agents[l.agent]=1;tasks[l.task]=1});
  function opts(o,sel){return '<option value="">全部</option>'+Object.keys(o).sort().map(function(k){return '<option'+(k===sel?' selected':'')+'>'+esc(k)+'</option>'}).join('')}
  var h='<div class="filters"><select id="fa">'+opts(agents,state.agent)+'</select><select id="ft">'+opts(tasks,state.task)+'</select>'+
        '<input type="search" id="fq" placeholder="搜尋日誌內容" value="'+esc(state.q)+'"></div>';
  var list=DATA.logs.filter(function(l){
    return (!state.agent||l.agent===state.agent)&&(!state.task||l.task===state.task)&&(!state.q||l.body.indexOf(state.q)>=0);
  });
  if(!list.length)return h+'<div class="empty">沒有符合的日誌</div>';
  var last='';
  list.forEach(function(x){if(x.date!==last){h+='<div class="day">'+esc(x.date||'未知日期')+'</div>';last=x.date}h+=logItem(x)});
  return h;
}
function render(){
  document.getElementById('gen').textContent='資料生成於 '+DATA.generated+'（重新執行 scripts/build_dashboard.py 後刷新頁面）';
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.v===state.view)});
  var v=document.getElementById('view');
  v.innerHTML=state.view==='overview'?overview():state.view==='progress'?progressView():state.view==='plans'?plansView():state.view==='tasks'?tasksView():logsView();
  Array.prototype.forEach.call(v.querySelectorAll('[data-task]'),function(e){e.onclick=function(){state.view='tasks';state.openTask=e.dataset.task;render();scrollTo(0,0)}});
  Array.prototype.forEach.call(v.querySelectorAll('[data-log]'),function(e){e.onclick=function(){state.view='logs';state.openLog=e.dataset.log;render();scrollTo(0,0)}});
  var b=document.getElementById('back');if(b)b.onclick=function(){state.openTask=null;state.openLog=null;render()};
  var fa=document.getElementById('fa');if(fa){
    fa.onchange=function(){state.agent=fa.value;render()};
    document.getElementById('ft').onchange=function(){state.task=this.value;render()};
    var q=document.getElementById('fq');q.onchange=function(){state.q=q.value;render()};
  }
}
document.getElementById('nav').onclick=function(e){
  var v=e.target.dataset&&e.target.dataset.v;if(!v)return;
  state.view=v;state.openTask=null;state.openLog=null;render();
};
render();
</script>
</body>
</html>
